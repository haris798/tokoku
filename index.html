<!doctype html>
<html lang="id" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Toko.ku</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
      body { margin: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 font-sans text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="app" class="flex h-full w-full overflow-hidden">
      
      <!-- Sidebar (Desktop) -->
      <aside class="hidden md:flex flex-col w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 z-20 shrink-0">
        <div class="p-6 flex items-center gap-3">
          <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200 dark:shadow-none">
            <span class="material-symbols-outlined">storefront</span>
          </div>
          <span class="font-bold text-xl tracking-tight text-slate-800 dark:text-slate-100">Toko.ku</span>
        </div>
        
        <nav class="flex-1 px-4 space-y-1 mt-4" id="sidebar-nav">
          <!-- Nav items injected by JS -->
        </nav>

        <div class="p-4 mt-auto border-t border-slate-100 dark:border-slate-800" id="sidebar-footer">
           <!-- Settings Nav injected by JS -->
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 flex flex-col h-full relative min-w-0">
        <!-- Topbar -->
        <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 md:px-8 flex items-center justify-between shrink-0 z-10">
          <div>
            <h1 id="page-title" class="text-lg font-bold text-slate-800 dark:text-slate-100">Dashboard</h1>
            <p id="page-subtitle" class="text-xs text-slate-400 font-medium hidden md:block">Ringkasan Sistem</p>
          </div>
          
          <div class="flex items-center gap-2 md:gap-4">
            <div id="sync-status" class="flex items-center gap-2 px-3 py-1.5 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-full text-xs font-bold border border-slate-200 dark:border-slate-700 transition-colors" title="Terakhir Sync: -">
              <span class="w-2 h-2 bg-slate-400 rounded-full indicator"></span>
              <span class="label hidden md:inline">OFFLINE</span>
              <span class="material-symbols-outlined text-[16px] md:hidden">cloud_off</span>
            </div>
            <div class="h-8 w-px bg-slate-200 dark:bg-slate-700 hidden md:block"></div>
            <button id="theme-toggle" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 rounded-full transition-colors">
              <span class="material-symbols-outlined text-[20px]" id="theme-icon">light_mode</span>
            </button>
            <button class="flex items-center gap-2">
              <div id="user-avatar" class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs font-bold">U</div>
            </button>
          </div>
        </header>

        <!-- Dynamic Page Content -->
        <div id="page-content" class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth pb-24 md:pb-8">
          <!-- Content injected by JS -->
        </div>
      </main>

      <!-- Bottom Navigation (Mobile) -->
      <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex justify-around items-center h-16 z-20 pb-safe" id="bottom-nav">
          <!-- Nav items injected by JS -->
      </nav>
    </div>

    <!-- Global Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Global Modal Container -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
        <!-- Modals injected by JS -->
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
